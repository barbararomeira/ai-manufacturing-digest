name: AI Manufacturing Digest

on:
  schedule:
    - cron: '0 15 * * 1'   # Every Monday at 15:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview extractions in the log without writing to Notion'
        type: boolean
        default: false
      max_llm_calls:
        description: 'Model call budget for this run (free tier allows ~50/day)'
        type: string
        default: '25'

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_LLM_CALLS: ${{ inputs.max_llm_calls || '25' }}
        run: python app.py
